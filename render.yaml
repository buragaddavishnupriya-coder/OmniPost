services:
  - type: web
    name: omnipost-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omnipost-db
          property: connectionString

databases:
  - name: omnipost-db
    databaseName: omnipost
    user: omnipost_user
    plan: free
